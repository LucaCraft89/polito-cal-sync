name: CI

on:
  push:
    branches: [main, 'm*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser for the web UI tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
        env:
          REQUIRE_BROWSER: '1'
      - run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: polito-cal-sync:ci
      - name: Container starts as non-root and healthcheck command works
        run: |
          docker run --rm --entrypoint id polito-cal-sync:ci -u | grep -qv '^0$'
          docker run --rm -v ci-data:/data polito-cal-sync:ci healthcheck
